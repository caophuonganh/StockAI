<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock AI</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="login" class="login"><div class="loginbox"><b>STOCK AI</b><h1>Đăng nhập</h1><input id="u" value="admin" placeholder="Tài khoản"><input id="p" type="password" placeholder="Mật khẩu"><label><input id="r" type="checkbox" checked> Ghi nhớ 30 ngày</label><button onclick="login()">Đăng nhập</button><p id="err"></p><small>Đây là login phía trình duyệt; không thay thế xác thực server-side.</small></div></div>
<div id="app" hidden><header><div><strong>STOCK AI</strong><small> Giám sát cổ phiếu tự động</small></div><div><span id="updated"></span> <button onclick="load()">Làm mới</button> <button onclick="logout()">Đăng xuất</button></div></header><main>
<div class="hero"><div><h1>Dashboard</h1><p id="status"></p></div><div id="chips"></div></div><div class="cards"><div>Tin tìm thấy<strong id="nf">0</strong></div><div>Tin mới<strong id="nn">0</strong></div><div>Mã kỹ thuật<strong id="nt">0</strong></div><div>Tín hiệu<strong id="ns">0</strong></div></div>
<section><div class="panel"><h2>Tín hiệu kỹ thuật</h2><select id="tf" onchange="renderTech()"><option value="">Tất cả mã</option></select><div class="table"><table><thead><tr><th>Mã</th><th>Giá</th><th>RSI</th><th>MFI</th><th>StochK</th><th>MACD</th><th>EMA5/10/20</th><th>Tín hiệu</th></tr></thead><tbody id="tb"></tbody></table></div></div><div class="panel"><h2>Cảnh báo</h2><div id="alerts"></div></div></section>
<div class="panel"><h2>Tin tức & Phân tích AI</h2><select id="nfilt" onchange="renderNews()"><option value="">Tất cả mã</option></select> <select id="type" onchange="renderNews()"><option value="">Tất cả</option><option>Cổ tức</option><option>BCTC</option><option>Rất quan trọng</option></select><div id="news"></div></div>
<div class="panel"><h2>Lỗi</h2><pre id="errors"></pre></div></main></div><script src="assets/app.js"></script></body></html>
